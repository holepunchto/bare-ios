name: App
include:
  - app/addons/addons.yml
packages:
  BareKit:
    url: https://github.com/holepunchto/bare-kit-swift
    branch: main
  BareRPC:
    url: https://github.com/holepunchto/bare-rpc-swift
    branch: main
  Schema:
    path: node_modules/bare-switch-core/spec/schema
  HRPC:
    path: node_modules/bare-switch-core/spec/hrpc
targets:
  App:
    type: application
    platform: iOS
    deploymentTarget: 18.4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.holepunch.bare.ios
        SWIFT_VERSION: 5.0
    info:
      path: app/Info.plist
      properties:
        NSLocalNetworkUsageDescription: Connects to nearby peers running this app to sync the switch.
    entitlements:
      path: app/App.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.to.holepunch.bare.ios
        com.apple.security.cs.allow-jit: true
    dependencies:
      - framework: app/frameworks/BareKit.xcframework
      - package: BareKit
      - package: BareRPC
      - package: Schema
      - package: HRPC
      - target: NotificationServiceExtension
    sources:
      - path: app/App.swift
      - path: app/BareTransport.swift
      - path: app/SyncModel.swift
      - path: app/ContentView.swift
      - path: app/app.bundle
        optional: true
    scheme:
      preActions:
        - name: Link
          script: |
            PATH="${PATH}" "${PWD}/node_modules/.bin/bare-link" \
              --preset ios \
              --out ${PWD}/app/addons \
              ${PWD}
        - name: Pack
          script: |
            PATH="${PATH}" "${PWD}/node_modules/.bin/bare-pack" \
              --preset ios \
              --linked \
              --base ${PWD} \
              --out ${PWD}/app/app.bundle \
              ${PWD}/node_modules/bare-switch-core/backend.js
            PATH="${PATH}" "${PWD}/node_modules/.bin/bare-pack" \
              --preset ios \
              --base ${PWD} \
              --out ${PWD}/app/push.bundle \
              ${PWD}/app/push.js
  NotificationServiceExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: 14.0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.holepunch.bare.ios.NotificationServiceExtension
        SWIFT_VERSION: 5.0
    info:
      path: app/NotificationServiceExtension.Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: NotificationServiceExtension.NotificationService
    entitlements:
      path: app/NotificationServiceExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.to.holepunch.bare.ios
        com.apple.developer.usernotifications.filtering: true
    dependencies:
      - framework: app/frameworks/BareKit.xcframework
      - package: BareKit
    sources:
      - path: app/NotificationService.swift
      - path: app/push.js
      - path: app/push.bundle
        optional: true
